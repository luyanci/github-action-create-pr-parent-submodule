name: 'GitHub Action Submodule Updates'
description: 'Update submodules and creates new pull request against parent repository'
author: 'releasehub'

branding:
  icon: 'git-pull-request'
  color: 'yellow'

inputs:
  github_token:
    description: 'Github Token'
    default: ${{ github.token }}
    required: false
  checkout_branch:
    description: 'Branch to checkout'
    required: false
  pr_against_branch:
    description: 'Parent branch'
    required: true
  parent_repository:
    description: 'Parent Repository'
    default: ${{ github.repository }}
    required: false
  owner:
    description: 'Owner'
    required: false
    default: ${{ github.repository_owner }}
  label:
    description: 'Create Release Environment label'
    required: false
    default: 'submodule'
  
runs:
  using: 'composite'
  steps:
  - name: Checkout parent repository and branch
    uses: actions/checkout@v7
    with:
      token: ${{ inputs.github_token }}
      repository: ${{ inputs.parent_repository }}
      ref: ${{ inputs.checkout_branch }}
      submodules: true
      fetch-depth: 0

  - name: Create new branch and push changes
    shell: bash
    run: |
      git config user.name github-actions[bot]
      git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      git submodule update --remote
      git checkout -b $GITHUB_RUN_ID
      git commit -am "updating submodules"
      git push --set-upstream origin $GITHUB_RUN_ID

  - id: create_pr
    name: Create pull request against target branch
    uses: actions/github-script@v9
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        const owner = ('${{ inputs.owner }}' || '${{ inputs.parent_repository }}'.split('/')[0].trim()).trim();
        const repo = '${{ inputs.parent_repository }}'.split('/')[1].trim();
        const { data: pr } = await github.rest.pulls.create({
          owner: owner,
          repo: repo,
          head: process.env.GITHUB_RUN_ID,
          base: '${{ inputs.pr_against_branch }}',
          title: `[Auto-generated] Submodule Updates ${process.env.GITHUB_RUN_ID}`,
          body: `[Auto-generated] Submodule Updates ${process.env.GITHUB_RUN_ID}`,
        });
        return pr.number;

  - name: Add labels
    uses: actions/github-script@v9
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        const owner = ('${{ inputs.owner }}' || '${{ inputs.parent_repository }}'.split('/')[0].trim()).trim();
        const repo = '${{ inputs.parent_repository }}'.split('/')[1].trim();
        const prNumber = parseInt('${{ steps.create_pr.outputs.result }}', 10);
        if (isNaN(prNumber)) {
          throw new Error('Could not determine PR number to add labels to.');
        }
        await github.rest.issues.addLabels({
          issue_number: prNumber,
          owner: owner,
          repo: repo,
          labels: ['${{ inputs.label }}']
        });
